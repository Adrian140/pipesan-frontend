[functions.create-checkout]
verify_jwt = true

# Stripe signs the raw request body; the handler verifies that signature before any DB access.
[functions.checkout-webhook]
verify_jwt = false

[functions.send-order-emails]
verify_jwt = true

# Auth is checked in the handler: cron sends x-cron-secret, admins send their JWT (role checked server-side).
[functions.prepcenter-sync]
verify_jwt = false
